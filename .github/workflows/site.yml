# Deploys uttero.dev (site/) to Netlify. Checks out only site/, so the DMGs and zips in this repo are never cloned.
# Secrets: NETLIFY_AUTH_TOKEN (personal access token), NETLIFY_SITE_ID (the uttero.dev site's API ID).
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site
          sparse-checkout-cone-mode: true
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --prod --dir=site --no-build --message "${GITHUB_SHA::7}"
